name: Bug Report
description: Report a bug or unexpected behavior in YDebug
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the form below to help us understand and reproduce the issue.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting a bug report.
      options:
        - label: I have searched existing issues to ensure this hasn't been reported before
          required: true
        - label: I am using the latest version of YDebug
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Run command 'ydebug server --port 9003'
        2. Start debugging session with '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: YDebug Version
      description: Run `ydebug --version` to get the version
      placeholder: v0.2.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      description: Run `php --version` to get your PHP version
      placeholder: 8.3.0
    validations:
      required: true

  - type: dropdown
    id: xdebug-version
    attributes:
      label: Xdebug Version
      description: What version of Xdebug are you using?
      options:
        - 3.3.x
        - 3.2.x
        - 3.1.x
        - 3.0.x
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version` to get your Node.js version
      options:
        - 20.x
        - 18.x
        - 16.x
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Linux
        - macOS
        - Windows
        - Docker
        - Other (specify in additional context)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - DBGp Protocol Communication
        - MCP Server Integration
        - CLI Commands
        - Debugging Sessions
        - AI Analysis
        - Configuration
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs
      description: Please provide relevant error logs or output
      placeholder: Paste error logs here...
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, configuration files, etc.)
      placeholder: Any additional information...
